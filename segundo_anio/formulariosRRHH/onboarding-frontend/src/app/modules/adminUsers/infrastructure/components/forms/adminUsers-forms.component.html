<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-circle">C</div>
      <div>
        <div class="logo-brand">civica software</div>
        <div class="logo-tagline">Panel de Recursos Humanos</div>
      </div>
    </div>

    <h2 class="login-title">Iniciar sesión</h2>
    <p class="login-subtitle">Accede con tu cuenta de administrador</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="email">Correo electrónico <span class="required-mark">*</span></label>
        <input id="email" type="email" class="form-control" formControlName="email"
          placeholder="admin@civicasoftware.com" autocomplete="email" />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
        <span class="field-error">Introduce un email válido</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Contraseña <span class="required-mark">*</span></label>
        <input id="password" type="password" class="form-control" formControlName="password" placeholder="••••••••"
          autocomplete="current-password" />
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
        <span class="field-error">La contraseña es obligatoria</span>
        }
      </div>

      <button type="submit" class="btn btn-primary login-btn" [disabled]="loading()">
        @if (loading()) {
        <span class="spinner-sm"></span> Accediendo...
        } @else {
        Entrar
        }
      </button>
    </form>
  </div>
</div>
