<div class="form-container">

  <h3>{{ model.id ? 'Edit Product' : 'New Product' }}</h3>

  <form (ngSubmit)="save()">

    <input type="text" placeholder="Name" [(ngModel)]="model.name" name="name" required />

    <input type="text" placeholder="Description" [(ngModel)]="model.description" name="description" />

    <input type="number" placeholder="Price" [(ngModel)]="model.price" name="price" required />

    <input type="number" placeholder="Stock" [(ngModel)]="model.stock" name="stock" required />

    <select [(ngModel)]="model.categoryId" name="categoryId" required>
      <option *ngFor="let c of categories" [value]="c.id">
        {{ c.name }}
      </option>
    </select>

    <div class="form-buttons">
      <button type="submit">
        {{ model.id ? 'Update' : 'Save' }}
      </button>

      <button type="button" (click)="cancel()">
        Cancel
      </button>
    </div>

  </form>

</div>
